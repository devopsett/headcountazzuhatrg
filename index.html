<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azzuha Terengganu - Kehadiran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .pop-anim {
      animation: pop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 0.22s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-14 selection:bg-emerald-600 selection:text-white">

  <!-- Header Ringkas (Tiada Akses atau Butang Admin) -->
  <header class="w-full bg-emerald-900 border-b border-emerald-700/60 text-white shadow-sm">
    <div class="max-w-md mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-amber-500 text-emerald-950 flex items-center justify-center shadow-md shadow-amber-500/20 shrink-0">
          <i class="fa-solid fa-kaaba text-lg"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-sm sm:text-base tracking-tight leading-snug text-white">Azzuha Group Travel & Tours</h1>
          <div class="flex items-center gap-1.5 mt-0.5">
            <p class="text-[11px] font-medium text-emerald-100 tracking-wide">Menyantuni Dengan Hati</p>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="w-full max-w-md mx-auto px-3.5 sm:px-4 pt-4 sm:pt-6 space-y-3.5">

    <!-- BORANG PENDAFTARAN PENGUNJUNG -->
    <section id="mode-kiosk" class="space-y-4">
      <div class="bg-white rounded-3xl shadow-xl border border-slate-200/90 overflow-hidden relative">
        <div class="bg-gradient-to-r from-emerald-800 via-emerald-700 to-teal-700 px-5 sm:px-6 py-4 sm:py-5 text-white relative overflow-hidden">
          <div class="absolute -right-6 -bottom-6 text-white/10 text-8xl pointer-events-none">
            <i class="fa-solid fa-mosque"></i>
          </div>
          <h2 class="text-lg sm:text-xl font-extrabold tracking-tight">Daftar Kehadiran</h2>
          <p class="text-xs text-emerald-100/90 mt-0.5">Sila lengkapkan maklumat ringkas di bawah.</p>
        </div>

        <form id="kioskForm" onsubmit="submitKioskCheckIn(event)" class="p-4 sm:p-6 space-y-4 sm:space-y-5">
          <div>
            <label for="kName" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">
              Nama <span class="text-rose-500">*</span>
            </label>
            <div class="relative">
              <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-500 flex items-center justify-center absolute left-2 top-1/2 -translate-y-1/2 pointer-events-none">
                <i class="fa-solid fa-user text-sm"></i>
              </div>
              <input type="text" id="kName" required placeholder="CONTOH: HJ AHMAD BIN ALI"
                oninput="this.value = this.value.toUpperCase()"
                class="w-full pl-14 pr-4 py-3 sm:py-3.5 text-sm sm:text-base font-bold uppercase text-slate-800 bg-slate-50/80 border-2 border-slate-200 rounded-2xl focus:bg-white focus:border-emerald-600 focus:ring-4 focus:ring-emerald-500/10 focus:outline-none transition-all placeholder:font-normal placeholder:text-slate-400 placeholder:normal-case" />
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="kPhone" class="block text-xs font-bold uppercase tracking-wider text-slate-500">
                Nombor Telefon (WhatsApp) <span class="text-rose-500">*</span>
              </label>
            </div>
            <div class="relative">
              <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-500 flex items-center justify-center absolute left-2 top-1/2 -translate-y-1/2 pointer-events-none">
                <i class="fa-brands fa-whatsapp text-base text-emerald-600"></i>
              </div>
              <input type="tel" id="kPhone" required placeholder="012-3456789" inputmode="numeric"
                class="w-full pl-14 pr-4 py-3 sm:py-3.5 text-sm sm:text-base font-semibold text-slate-800 bg-slate-50/80 border-2 border-slate-200 rounded-2xl focus:bg-white focus:border-emerald-600 focus:ring-4 focus:ring-emerald-500/10 focus:outline-none transition-all placeholder:font-normal placeholder:text-slate-400" />
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-500">
                Kategori Pilihan <span class="text-rose-500">*</span>
              </label>
            </div>
            <div class="grid grid-cols-3 gap-2" id="kioskInterestPills">
              <button type="button" onclick="selectKioskInterest('Umrah')" data-val="Umrah"
                class="k-interest-btn py-2.5 sm:py-3 px-2 rounded-2xl border-2 border-slate-200 bg-white hover:bg-slate-50 text-slate-600 font-semibold text-xs flex flex-col items-center justify-center gap-1 transition-all touch-manipulation">
                <i class="fa-solid fa-kaaba text-sm sm:text-base text-slate-400"></i>
                <span>Umrah</span>
              </button>
              <button type="button" onclick="selectKioskInterest('Haji')" data-val="Haji"
                class="k-interest-btn py-2.5 sm:py-3 px-2 rounded-2xl border-2 border-slate-200 bg-white hover:bg-slate-50 text-slate-600 font-semibold text-xs flex flex-col items-center justify-center gap-1 transition-all touch-manipulation">
                <i class="fa-solid fa-mosque text-sm sm:text-base text-slate-400"></i>
                <span>Haji</span>
              </button>
              <button type="button" onclick="selectKioskInterest('Lain-lain')" data-val="Lain-lain"
                class="k-interest-btn py-2.5 sm:py-3 px-2 rounded-2xl border-2 border-slate-200 bg-white hover:bg-slate-50 text-slate-600 font-semibold text-xs flex flex-col items-center justify-center gap-1 transition-all touch-manipulation">
                <i class="fa-solid fa-compass text-sm sm:text-base text-slate-400"></i>
                <span>Lain-lain</span>
              </button>
            </div>
            <p id="catErrorMsg" class="hidden text-xs font-bold text-rose-600 mt-1.5 flex items-center gap-1">
              <i class="fa-solid fa-circle-exclamation"></i> Sila pilih salah satu kategori di atas.
            </p>

            <div id="hajiSubOptions" class="hidden mt-2.5 p-3 bg-gradient-to-br from-emerald-50 to-teal-50/60 border-2 border-emerald-200/80 rounded-2xl fade-in">
              <div class="flex items-center justify-between mb-2">
                <label class="text-xs font-extrabold text-emerald-900 flex items-center gap-1.5">
                  <i class="fa-solid fa-sliders text-emerald-600"></i> Status Haji: <span class="text-rose-500">*</span>
                </label>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="selectHajiType('Haji (Rayuan)')" data-haji="Haji (Rayuan)"
                  class="haji-sub-btn py-2.5 px-2.5 rounded-xl border-2 border-slate-200/90 bg-white/70 text-slate-600 font-semibold text-xs flex items-center justify-center gap-1.5 transition-all touch-manipulation">
                  <i class="fa-regular fa-circle text-slate-400 text-sm"></i>
                  <span>Rayuan</span>
                </button>
                <button type="button" onclick="selectHajiType('Haji (P1)')" data-haji="Haji (P1)"
                  class="haji-sub-btn py-2.5 px-2.5 rounded-xl border-2 border-slate-200/90 bg-white/70 text-slate-600 font-semibold text-xs flex items-center justify-center gap-1.5 transition-all touch-manipulation">
                  <i class="fa-regular fa-circle text-slate-400 text-sm"></i>
                  <span>P1 (Terpilih)</span>
                </button>
              </div>
              <p id="hajiErrorMsg" class="hidden text-xs font-bold text-rose-600 mt-2 flex items-center gap-1">
                <i class="fa-solid fa-circle-exclamation"></i> Sila pilih status haji anda: Rayuan atau P1.
              </p>
            </div>
          </div>

          <button type="submit" id="btnSubmit" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 active:scale-[0.99] text-white font-extrabold py-3.5 sm:py-4 px-6 rounded-2xl shadow-lg shadow-emerald-600/25 transition-all flex items-center justify-center gap-2 text-sm sm:text-base touch-manipulation">
            <i class="fa-solid fa-paper-plane"></i>
            <span>Hantar</span>
          </button>
        </form>

        <div id="thankYouOverlay" class="hidden absolute inset-0 bg-white/95 backdrop-blur-md p-6 flex-col items-center justify-center text-center z-20 fade-in">
          <div class="w-16 sm:w-20 h-16 sm:h-20 rounded-3xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl sm:text-4xl mb-3 shadow-inner">
            <i class="fa-solid fa-check"></i>
          </div>
          <span class="text-[10px] sm:text-[11px] font-extrabold uppercase tracking-widest text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full mb-1.5">Pendaftaran Berjaya</span>
          <h3 class="text-xl sm:text-2xl font-extrabold text-slate-800">Terima Kasih!</h3>
          <p class="text-xs sm:text-sm text-slate-500 mt-1 max-w-[240px]">Maklumat kehadiran anda telah berjaya disimpan.</p>
          <button onclick="closeThankYouOverlay()" class="mt-5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-6 py-3 rounded-xl shadow-md transition touch-manipulation">
            Daftar Seterusnya
          </button>
        </div>
      </div>
    </section>

  </main>

  <script>
    const LIVE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTHgxQJSF9TYEinCsLDxROYmfDYoylUUdrY8AdaddF2J7DDg7OqCa0ii-Qjm4RtUja/exec';
    let selectedMainCategory = '';
    let selectedKioskInterest = '';
    let selectedHajiSubType = '';
    let thankYouTimer = null;

    function getTodayStr() {
      return new Date().toISOString().split('T')[0];
    }

    function getTimeStr() {
      return new Date().toTimeString().split(' ')[0];
    }

    function selectKioskInterest(val) {
      selectedMainCategory = val;
      const hajiBox = document.getElementById('hajiSubOptions');
      const catError = document.getElementById('catErrorMsg');
      
      if (catError) catError.classList.add('hidden');

      if (val === 'Haji') {
        hajiBox.classList.remove('hidden');
        selectedKioskInterest = selectedHajiSubType || '';
      } else {
        hajiBox.classList.add('hidden');
        selectedHajiSubType = '';
        selectedKioskInterest = val;
        resetHajiSubButtons();
      }

      document.querySelectorAll('.k-interest-btn').forEach(btn => {
        const icon = btn.querySelector('i');
        if (btn.dataset.val === val) {
          btn.className = 'k-interest-btn py-2.5 sm:py-3 px-2 rounded-2xl border-2 border-emerald-600 bg-emerald-50/80 text-emerald-900 font-bold text-xs flex flex-col items-center justify-center gap-1 shadow-sm transition-all touch-manipulation';
          if (icon) {
            icon.classList.remove('text-slate-400');
            icon.classList.add('text-emerald-600');
          }
        } else {
          btn.className = 'k-interest-btn py-2.5 sm:py-3 px-2 rounded-2xl border-2 border-slate-200 bg-white hover:bg-slate-50 text-slate-600 font-semibold text-xs flex flex-col items-center justify-center gap-1 transition-all touch-manipulation';
          if (icon) {
            icon.classList.remove('text-emerald-600');
            icon.classList.add('text-slate-400');
          }
        }
      });
    }

    function resetHajiSubButtons() {
      const hajiError = document.getElementById('hajiErrorMsg');
      if (hajiError) hajiError.classList.add('hidden');
      document.querySelectorAll('.haji-sub-btn').forEach(btn => {
        const icon = btn.querySelector('i');
        btn.className = 'haji-sub-btn py-2.5 px-2.5 rounded-xl border-2 border-slate-200/90 bg-white/70 text-slate-600 font-semibold text-xs flex items-center justify-center gap-1.5 transition-all touch-manipulation';
        if (icon) icon.className = 'fa-regular fa-circle text-slate-400 text-sm';
      });
    }

    function selectHajiType(subVal) {
      selectedHajiSubType = subVal;
      selectedKioskInterest = subVal;
      const hajiError = document.getElementById('hajiErrorMsg');
      if (hajiError) hajiError.classList.add('hidden');

      document.querySelectorAll('.haji-sub-btn').forEach(btn => {
        const icon = btn.querySelector('i');
        if (btn.dataset.haji === subVal) {
          btn.className = 'haji-sub-btn py-2.5 px-2.5 rounded-xl border-2 border-emerald-600 bg-white text-emerald-900 font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm transition-all touch-manipulation';
          if (icon) icon.className = 'fa-solid fa-circle-check text-emerald-600 text-sm';
        } else {
          btn.className = 'haji-sub-btn py-2.5 px-2.5 rounded-xl border-2 border-slate-200/90 bg-white/70 text-slate-600 font-semibold text-xs flex items-center justify-center gap-1.5 transition-all touch-manipulation';
          if (icon) icon.className = 'fa-regular fa-circle text-slate-400 text-sm';
        }
      });
    }

    function resetCategorySelection() {
      selectedMainCategory = '';
      selectedKioskInterest = '';
      selectedHajiSubType = '';

      document.querySelectorAll('.k-interest-btn').forEach(btn => {
        const icon = btn.querySelector('i');
        btn.className = 'k-interest-btn py-2.5 sm:py-3 px-2 rounded-2xl border-2 border-slate-200 bg-white hover:bg-slate-50 text-slate-600 font-semibold text-xs flex flex-col items-center justify-center gap-1 transition-all touch-manipulation';
        if (icon) {
          icon.classList.remove('text-emerald-600');
          icon.classList.add('text-slate-400');
        }
      });

      const hajiBox = document.getElementById('hajiSubOptions');
      if (hajiBox) hajiBox.classList.add('hidden');
      resetHajiSubButtons();

      const catError = document.getElementById('catErrorMsg');
      if (catError) catError.classList.add('hidden');
    }

    async function submitKioskCheckIn(e) {
      e.preventDefault();
      const rawName = document.getElementById('kName').value.trim();
      const name = rawName.toUpperCase();
      const phone = document.getElementById('kPhone').value.trim();

      if (!name) return;
      if (!phone) {
        document.getElementById('kPhone').focus();
        return;
      }

      if (!selectedMainCategory) {
        const catError = document.getElementById('catErrorMsg');
        if (catError) catError.classList.remove('hidden');
        document.getElementById('kioskInterestPills').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      if (selectedMainCategory === 'Haji' && !selectedHajiSubType) {
        const hajiError = document.getElementById('hajiErrorMsg');
        if (hajiError) hajiError.classList.remove('hidden');
        document.getElementById('hajiSubOptions').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      const submitBtn = document.getElementById('btnSubmit');
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75');

      const record = {
        date: getTodayStr(),
        time: getTimeStr(),
        name: name,
        phone: phone,
        interest: selectedKioskInterest,
        staff: '-',
        notes: ''
      };

      try {
        fetch(LIVE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(record)
        });
      } catch (err) {
        console.error('Save error:', err);
      }

      const overlay = document.getElementById('thankYouOverlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');

      document.getElementById('kName').value = '';
      document.getElementById('kPhone').value = '';
      resetCategorySelection();

      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-75');

      if (thankYouTimer) clearTimeout(thankYouTimer);
      thankYouTimer = setTimeout(closeThankYouOverlay, 3200);
    }

    function closeThankYouOverlay() {
      const overlay = document.getElementById('thankYouOverlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
      document.getElementById('kName').focus();
    }
  </script>
</body>
</html>
