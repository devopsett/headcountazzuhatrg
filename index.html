<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azzuha Group Travel & Tours — Pendaftaran Jemaah</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        azzuha: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- Notifikasi Toast -->
    <div id="toast-container" class="fixed top-4 right-4 left-4 sm:left-auto z-50 flex flex-col gap-2 max-w-sm sm:w-full pointer-events-none mx-auto sm:mx-0"></div>

    <!-- Header Bersih Khusus Jemaah -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-azzuha-600 flex items-center justify-center text-white shrink-0 shadow-sm">
                    <i data-lucide="compass" class="w-5 h-5"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="font-extrabold text-slate-900 text-sm sm:text-base tracking-tight truncate">Azzuha Group Travel & Tours</h1>
                    <p class="text-xs font-medium text-azzuha-700 truncate">Cawangan Terengganu</p>
                </div>
            </div>
            <span id="sync-badge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-800 shrink-0">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                Demo
            </span>
        </div>
    </header>

    <!-- Kandungan Utama Borang Jemaah -->
    <main class="flex-1 max-w-xl w-full mx-auto px-4 py-6 space-y-5">

        <!-- Kad Event Semasa -->
        <div class="bg-gradient-to-r from-azzuha-800 to-azzuha-600 rounded-2xl p-5 text-white shadow-md">
            <span class="text-[11px] uppercase tracking-wider font-semibold text-azzuha-100 block">Event Aktif Semasa</span>
            <h2 id="banner-event-name" class="text-lg sm:text-xl font-extrabold leading-snug mt-0.5 truncate">Ekspo Umrah & Haji 2026</h2>
        </div>

        <!-- Borang Pendaftaran Jemaah -->
        <div id="form-card" class="bg-white rounded-3xl border border-slate-200/90 shadow-sm p-5 sm:p-7">
            <div class="mb-5">
                <h3 class="text-lg font-bold text-slate-900">Selamat Datang ke Booth Azzuha</h3>
                <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Sila pilih pakej pilihan dan lengkapkan maklumat ringkas di bawah.</p>
            </div>

            <form id="jemaah-form" onsubmit="submitJemaah(event)" class="space-y-5">
                <!-- 1. PILIH UMRAH ATAU HAJI -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">1. Pilihan Pakej *</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="pakej" value="Umrah" checked class="peer sr-only">
                            <div class="p-4 rounded-2xl border-2 border-slate-200 bg-slate-50/60 peer-checked:border-azzuha-600 peer-checked:bg-azzuha-50 peer-checked:text-azzuha-900 text-center transition-all active:scale-95">
                                <div class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center mx-auto mb-2 text-azzuha-600">
                                    <i data-lucide="moon" class="w-5 h-5"></i>
                                </div>
                                <span class="font-extrabold text-base block">UMRAH</span>
                                <span class="text-[11px] text-slate-500">Pakej Umrah Azzuha</span>
                            </div>
                        </label>

                        <label class="cursor-pointer">
                            <input type="radio" name="pakej" value="Haji" class="peer sr-only">
                            <div class="p-4 rounded-2xl border-2 border-slate-200 bg-slate-50/60 peer-checked:border-amber-500 peer-checked:bg-amber-50 peer-checked:text-amber-950 text-center transition-all active:scale-95">
                                <div class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center mx-auto mb-2 text-amber-600">
                                    <i data-lucide="sun" class="w-5 h-5"></i>
                                </div>
                                <span class="font-extrabold text-base block">HAJI</span>
                                <span class="text-[11px] text-slate-500">Pakej Haji Azzuha</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 2. NAMA JEMAAH -->
                <div>
                    <label for="input-nama" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">2. Nama Jemaah *</label>
                    <input type="text" id="input-nama" required placeholder="Contoh: Ahmad bin Abdullah" autocomplete="name"
                        class="w-full px-4 py-3.5 bg-slate-50 border border-slate-300 rounded-2xl text-base font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-azzuha-500 focus:border-azzuha-500 transition-all">
                </div>

                <!-- 3. NO TELEFON -->
                <div>
                    <label for="input-phone" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">3. No. Telefon (WhatsApp) *</label>
                    <input type="tel" id="input-phone" required placeholder="Contoh: 019-9876543" autocomplete="tel"
                        class="w-full px-4 py-3.5 bg-slate-50 border border-slate-300 rounded-2xl text-base font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-azzuha-500 focus:border-azzuha-500 transition-all">
                </div>

                <!-- 4. BERAPA PAX -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">4. Berapa Pax (Bilangan Jemaah) *</label>
                    <div class="flex items-center justify-between bg-slate-50 border border-slate-300 rounded-2xl p-2">
                        <button type="button" onclick="ubahPax(-1)" class="w-12 h-12 rounded-xl bg-white border border-slate-200 shadow-sm hover:bg-slate-100 active:scale-95 flex items-center justify-center text-xl font-extrabold text-slate-700">
                            -
                        </button>
                        <div class="text-center">
                            <input type="number" id="input-pax" value="1" min="1" max="100" required
                                class="w-20 text-center bg-transparent text-2xl font-extrabold text-slate-900 focus:outline-none">
                            <span class="text-xs font-semibold text-slate-500 block -mt-1">Orang / Pax</span>
                        </div>
                        <button type="button" onclick="ubahPax(1)" class="w-12 h-12 rounded-xl bg-azzuha-600 text-white shadow-sm hover:bg-azzuha-700 active:scale-95 flex items-center justify-center text-xl font-extrabold">
                            +
                        </button>
                    </div>
                </div>

                <!-- BUTANG SUBMIT -->
                <button type="submit" id="btn-submit"
                    class="w-full py-4 px-6 rounded-2xl bg-azzuha-600 hover:bg-azzuha-700 active:scale-[0.99] text-white font-extrabold text-base shadow-lg shadow-azzuha-600/25 flex items-center justify-center gap-2 transition-all">
                    <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                    <span>Hantar Pendaftaran</span>
                </button>
            </form>
        </div>

        <!-- Skrin Pengesahan Selepas Submit -->
        <div id="success-card" class="hidden bg-emerald-50 border border-emerald-200 rounded-3xl p-6 text-center space-y-3">
            <div class="w-14 h-14 rounded-full bg-emerald-600 text-white flex items-center justify-center mx-auto shadow-md">
                <i data-lucide="check" class="w-7 h-7"></i>
            </div>
            <h3 class="text-lg font-extrabold text-emerald-950">Terima Kasih! Rekod Berjaya Disimpan</h3>
            <p id="success-summary" class="text-sm text-emerald-800 font-medium"></p>
            <div class="pt-2">
                <button onclick="resetUntukJemaahBaru()" class="px-6 py-3 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-bold shadow-sm transition-all">
                    Daftar Jemaah Seterusnya &rarr;
                </button>
            </div>
        </div>

    </main>

    <script>
        const KEYS = {
            API_URL: 'azzuha_simple_api_url',
            EVENT_NAME: 'azzuha_simple_event_name',
            DEMO_RECORDS: 'azzuha_simple_demo_records'
        };

        // Pautan Google Apps Script tetap untuk semua peranti jemaah
        const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbyTHgxQJSF9TYEinCsLDxROYmfDYoylUUdrY8AdaddF2J7DDg7OqCa0ii-Qjm4RtUja/exec';

        let state = {
            apiUrl: localStorage.getItem(KEYS.API_URL) || DEFAULT_API_URL,
            currentEvent: localStorage.getItem(KEYS.EVENT_NAME) || 'Ekspo Umrah & Haji 2026'
        };

        window.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            document.getElementById('banner-event-name').textContent = state.currentEvent;

            const badge = document.getElementById('sync-badge');
            if (state.apiUrl) {
                badge.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-100 text-emerald-800 shrink-0';
                badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Live';

                // Semak nama event semasa daripada Google Sheet yang ditetapkan oleh Admin
                try {
                    const res = await fetch(state.apiUrl);
                    const data = await res.json();
                    if (data.success && data.activeEvent) {
                        state.currentEvent = data.activeEvent;
                        localStorage.setItem(KEYS.EVENT_NAME, state.currentEvent);
                        document.getElementById('banner-event-name').textContent = state.currentEvent;
                    }
                } catch (err) {
                    console.error(err);
                }
            }
        });

        function ubahPax(delta) {
            const input = document.getElementById('input-pax');
            let val = parseInt(input.value, 10) || 1;
            val = Math.max(1, Math.min(100, val + delta));
            input.value = val;
        }

        async function submitJemaah(e) {
            e.preventDefault();

            const pakejEl = document.querySelector('input[name="pakej"]:checked');
            const pakej = pakejEl ? pakejEl.value : 'Umrah';
            const nama = document.getElementById('input-nama').value.trim();
            const phone = document.getElementById('input-phone').value.trim();
            const pax = Math.max(1, parseInt(document.getElementById('input-pax').value, 10) || 1);

            if (!nama || !phone) {
                showToast('Sila isi Nama dan No. Telefon anda.', 'error');
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerHTML = '<span>Menghantar...</span>';

            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const timestamp = `${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

            const newRecord = {
                id: 'AZH-' + Math.floor(1000 + Math.random() * 9000),
                timestamp: timestamp,
                eventName: state.currentEvent,
                pakej: pakej,
                nama: nama,
                phone: phone,
                pax: pax
            };

            if (state.apiUrl) {
                try {
                    await fetch(state.apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(newRecord)
                    });
                } catch (err) {
                    console.error(err);
                    showToast('Ralat sambungan, sila cuba semula.', 'error');
                }
            } else {
                const existing = JSON.parse(localStorage.getItem(KEYS.DEMO_RECORDS) || '[]');
                existing.unshift(newRecord);
                localStorage.setItem(KEYS.DEMO_RECORDS, JSON.stringify(existing));
            }

            btn.disabled = false;
            btn.innerHTML = '<i data-lucide="check-circle-2" class="w-5 h-5"></i><span>Hantar Pendaftaran</span>';
            lucide.createIcons();

            document.getElementById('form-card').classList.add('hidden');
            document.getElementById('success-summary').textContent = `${nama} • Pakej ${pakej} (${pax} Pax)`;
            document.getElementById('success-card').classList.remove('hidden');
        }

        function resetUntukJemaahBaru() {
            document.getElementById('jemaah-form').reset();
            document.getElementById('input-pax').value = 1;
            document.getElementById('success-card').classList.add('hidden');
            document.getElementById('form-card').classList.remove('hidden');
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'error' ? 'bg-rose-600' : 'bg-slate-900';
            toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-semibold pointer-events-auto transition-all`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 250);
            }, 3000);
        }
    </script>
</body>
</html>
